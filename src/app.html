<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/png" sizes="192x192" href="%sveltekit.assets%/clodia-icon-192.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta property="og:title" content="Clodia Colony" />
		<meta property="og:description" content="La WebUI della colonia Clodia." />
		<meta property="og:image" content="%sveltekit.assets%/clodia-colony-social.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="400" />
		<title>Clodia Colony</title>
		<script>
			// Applica tema + zoom font PRIMA del paint (niente flash).
			try {
				var t = localStorage.getItem('clodia.webui.theme');
				if (t) document.documentElement.setAttribute('data-theme', t);
				var z = localStorage.getItem('clodia.webui.fontScale');
				if (z) document.documentElement.style.zoom = z;
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
